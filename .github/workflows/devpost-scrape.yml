name: devpost-scrape

on:
  push:
    branches:
      - agent/devpost-pagination-links

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Recover MakeMIT x Harvard projects and Git histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/scrape.py <<'PY'
          from __future__ import annotations
          import json, os, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 SundaiResearch/1.0'
          base='https://makemit-2026.devpost.com/project-gallery'
          urls=[]; pages=[]
          for page in range(1,8):
              u=base if page==1 else f'{base}?page={page}'
              r=s.get(u,timeout=60); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
              found=[]
              for a in soup.select('a[href]'):
                  h=urljoin(u,a.get('href','')); p=urlparse(h)
                  if p.netloc in {'devpost.com','www.devpost.com'} and p.path.startswith('/software/'):
                      h='https://devpost.com'+p.path.rstrip('/')
                      if h not in found: found.append(h)
              pages.append({'page':page,'url':u,'count':len(found),'projects':found})
              for h in found:
                  if h not in urls: urls.append(h)
              print('gallery',page,len(found),'unique',len(urls),flush=True)
              if not found or len(urls)>=51: break
              time.sleep(.3)

          gh_headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'SundaiResearch/1.0'}
          def repo_id(raw):
              p=urlparse(raw)
              if p.netloc.lower() not in {'github.com','www.github.com'}: return None
              z=[x for x in p.path.split('/') if x]
              if len(z)<2 or z[0].lower() in {'features','topics','marketplace','orgs','settings','login','signup'}: return None
              return f'{z[0]}/{z[1].removesuffix(".git")}'
          def commits(name):
              r=requests.get(f'https://api.github.com/repos/{name}/commits',headers=gh_headers,params={'per_page':1},timeout=60)
              if r.status_code!=200:return {'status':r.status_code,'count':None}
              m=re.search(r'[?&]page=(\d+)>; rel="last"',r.headers.get('Link',''))
              return {'status':200,'count':int(m.group(1)) if m else len(r.json())}

          out=[]
          for i,u in enumerate(urls,1):
              r=s.get(u,timeout=60); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
              def txt(sel):
                  n=soup.select_one(sel); return ' '.join(n.get_text(' ',strip=True).split()) if n else None
              title=txt('h1')
              tagline=txt('h3')
              if not tagline:
                  m=soup.select_one('meta[property="og:description"]'); tagline=m.get('content') if m else None
              submitted=[]
              for n in soup.select('#submissions a'):
                  t=' '.join(n.get_text(' ',strip=True).split())
                  if t and t not in submitted:submitted.append(t)
              links=[]; repos=[]
              for a in soup.select('a[href]'):
                  h=urljoin(u,a.get('href',''))
                  if h not in links:links.append(h)
                  q=repo_id(h)
                  if q and q not in repos:repos.append(q)
              rr=[]
              for name in repos:
                  x=requests.get(f'https://api.github.com/repos/{name}',headers=gh_headers,timeout=60)
                  if x.status_code==200:
                      d=x.json(); c=commits(name)
                      rr.append({'full_name':name,'url':d.get('html_url'),'description':d.get('description'),'created_at':d.get('created_at'),'updated_at':d.get('updated_at'),'pushed_at':d.get('pushed_at'),'default_branch':d.get('default_branch'),'language':d.get('language'),'size_kb':d.get('size'),'fork':d.get('fork'),'archived':d.get('archived'),'commit_count':c['count'],'commit_status':c['status']})
                  else:rr.append({'full_name':name,'status':x.status_code})
              out.append({'ordinal':i,'title':title,'tagline':tagline,'devpost_url':u,'submitted_to':submitted,'github_urls':[x for x in links if repo_id(x)],'repositories':rr,'external_urls':[x for x in links if urlparse(x).netloc not in {'devpost.com','www.devpost.com','makemit-2026.devpost.com','secure.devpost.com'}]})
              print(i,'/',len(urls),title,'repos',len(rr),flush=True); time.sleep(.2)
          data={'event':'MakeMIT x Harvard 2026','expected':51,'recovered':len(out),'gallery_pages':pages,'projects':out}
          Path('makemit-projects.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          summary={'recovered':len(out),'exact_repo_projects':sum(bool(p['repositories']) for p in out),'multi_commit_repositories':sum(1 for p in out for r in p['repositories'] if isinstance(r.get('commit_count'),int) and r['commit_count']>=2),'repository_records':sum(len(p['repositories']) for p in out)}
          Path('makemit-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          if len(out)!=51: raise SystemExit(f'expected 51 projects, recovered {len(out)}')
          PY
          python /tmp/scrape.py
      - uses: actions/upload-artifact@v4
        with:
          name: devpost-research
          path: |
            makemit-projects.json
            makemit-summary.json
          retention-days: 7
          if-no-files-found: error
